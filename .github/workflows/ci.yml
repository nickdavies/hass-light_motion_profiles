name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.8
      - name: Ruff lint
        run: ruff check tests/ custom_components/
      - name: Ruff format
        run: ruff format --check tests/ tests_integration/

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest voluptuous
      - name: Run unit tests
        run: python -m pytest tests/ -v

  integration-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        # lovelace_codegen's main, not a pinned commit: what deploys is pinned
        # by hass-configs, so this is here to catch a library change that
        # breaks this component before that pin moves.
        with:
          repository: nickdavies/hass-lovelace_codegen
          path: .deps/hass-lovelace_codegen
      - uses: actions/checkout@v4
        # The same for the config bridge, which pins this component's
        # entities through its claims.
        with:
          repository: nickdavies/hass-config_bridge
          path: .deps/hass-config_bridge
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      # This release installs Home Assistant 2026.9.2, the version homelab
      # deploys. Each release pins exactly one Home Assistant version, so move
      # this whenever homelab's does.
      - run: pip install pytest pytest-homeassistant-custom-component==0.13.365 voluptuous tzdata
      - name: Run integration tests
        run: python -m pytest tests_integration/ -v
